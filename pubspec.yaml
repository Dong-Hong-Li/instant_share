name: instant_share
description: "Instant Share - 即时分享"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 基础
  shared_preferences: ^2.5.5

  flutter_screenutil: ^5.9.3

  
  state_scope:
    path: packages/state_scope

  flutter_riverpod: ^3.3.1

  intl: ^0.20.2

  # 路由
  fluro_router_generate: ^1.4.2

  # 本地化（ARB）
  ai_localizations:
    path: packages/ai_localizations
    
  
  uuid: ^4.5.3

  assets_gen:
    path: ../assets_gen
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.13.0
  # 与 net_retrofit_dio（analyzer <9）同仓解析；勿升到 6.11.4+ 以免强制 analyzer 9+
  json_serializable: ^6.14.0
  # 运行时模型注解
  json_annotation: ^4.12.0
  
  # # 本地 monorepo：../contract_driven_interface_generation（仓内 path 互引无需 overrides）
  # contract_driven_interface_generation:
  #   path: ../contract_driven_interface_generation/packages/contract_driven_interface_generation

  # # 生成器配置（路径相对本 pubspec 所在目录）
  # contract_driven_interface_generation:
  #   output_root: lib/generated
  #   open_api_files:
  #     - openapi/api.yaml
  #   unwrap_success_data: false
  #   dirs:
  #     apis: apis
  #     interfaces: interfaces
  #     dto: models/dto
  #     vo: models/vo

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/translations/