name: Build Release

# Tag 触发（正式发版）：
#   - 格式：v{version}-{windows|macos|linux|android}，例如 v1.0.0-windows
#   - 重要：workflow 文件必须在 default 分支（main）上，仅推 test 分支不会触发 tag CI
#   - 开发流程：test 验证 → 合并 workflow 到 main → 打 tag 并 push
#
# 手动触发（test 分支调试）：
#   Actions → Build Release → Run workflow → 选 test 分支 + platform
on:
  push:
    tags:
      - "*-windows"
      - "*-macos"
      - "*-linux"
      - "*-android"
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - windows
          - macos
          - linux
          - android
      version:
        description: Version label for artifact name
        required: true
        default: 1.0.0-test

permissions:
  contents: write

jobs:
  build-windows:
    if: |
      (github.event_name == 'push' && endsWith(github.ref_name, '-windows')) ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows')
    runs-on: windows-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v(.+)-windows$ ]]; then
              echo "::error::Tag 格式须为 v{version}-windows，例如 v1.0.0-windows"
              exit 1
            fi
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone assets_gen
        shell: bash
        run: git clone --depth 1 https://gitee.com/lidonghonglalala/assets_gen.git "${GITHUB_WORKSPACE}/../assets_gen"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: instant_share_server/go.sum

      - name: Setup MSYS2 MinGW (Go CGO)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain
          path-type: inherit

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        working-directory: instant_share_server
        run: ./build_web.sh

      - name: Build Go c-shared library
        shell: msys2 {0}
        run: |
          gcc --version
          go version
          cd instant_share_server
          export CGO_ENABLED=1
          mkdir -p ../assets/lib
          go build -buildmode=c-shared -o ../assets/lib/instantshare.dll ./cmd/lib
          rm -f ../assets/lib/instantshare.h
          test -f ../assets/lib/instantshare.dll

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify output
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($file in @("instant_share.exe", "instantshare.dll", "flutter_windows.dll")) {
            if (-not (Test-Path (Join-Path $release $file))) { throw "Missing $file" }
          }

      - name: Archive Release bundle
        shell: pwsh
        run: |
          $zip = "instant_share-windows-x64-v${{ env.VERSION }}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip -Force
          echo "ARCHIVE=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant_share-windows-x64
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true

  build-macos:
    if: |
      (github.event_name == 'push' && endsWith(github.ref_name, '-macos')) ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'macos')
    runs-on: macos-latest
    steps:
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v(.+)-macos$ ]]; then
              echo "::error::Tag 格式须为 v{version}-macos，例如 v1.0.0-macos"
              exit 1
            fi
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone assets_gen
        run: git clone --depth 1 https://gitee.com/lidonghonglalala/assets_gen.git "${GITHUB_WORKSPACE}/../assets_gen"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: instant_share_server/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Go c-shared library
        working-directory: instant_share_server
        run: ./build_lib.sh macos

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Verify output
        run: |
          APP="build/macos/Build/Products/Release/instant_share.app"
          DYLIB="$APP/Contents/Resources/libinstantshare.dylib"
          test -d "$APP" || (echo "Missing $APP" && exit 1)
          test -f "$DYLIB" || (echo "Missing $DYLIB" && exit 1)

      - name: Archive Release bundle
        run: |
          ARCHIVE="instant_share-macos-v${{ env.VERSION }}.zip"
          cd build/macos/Build/Products/Release
          zip -r "../../../../../${ARCHIVE}" instant_share.app
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant_share-macos
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true

  build-linux:
    if: |
      (github.event_name == 'push' && endsWith(github.ref_name, '-linux')) ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'linux')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v(.+)-linux$ ]]; then
              echo "::error::Tag 格式须为 v{version}-linux，例如 v1.0.0-linux"
              exit 1
            fi
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone assets_gen
        run: git clone --depth 1 https://gitee.com/lidonghonglalala/assets_gen.git "${GITHUB_WORKSPACE}/../assets_gen"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: instant_share_server/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Go c-shared library
        working-directory: instant_share_server
        run: ./build_lib.sh linux

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Copy native library into bundle
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          cp assets/lib/libinstantshare.so "$BUNDLE/"
          chmod +x "$BUNDLE/instant_share"

      - name: Verify output
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          test -f "$BUNDLE/instant_share" || exit 1
          test -f "$BUNDLE/libinstantshare.so" || exit 1

      - name: Archive Release bundle
        run: |
          ARCHIVE="instant_share-linux-x64-v${{ env.VERSION }}.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release bundle
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant_share-linux-x64
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true

  build-android:
    if: |
      (github.event_name == 'push' && endsWith(github.ref_name, '-android')) ||
      (github.event_name == 'workflow_dispatch' && inputs.platform == 'android')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v(.+)-android$ ]]; then
              echo "::error::Tag 格式须为 v{version}-android，例如 v1.0.0-android"
              exit 1
            fi
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: instant_share_server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${SDK}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Go c-shared library
        working-directory: instant_share_server
        run: ./build_lib.sh android

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release --split-per-abi

      - name: Verify output
        run: |
          OUT="build/app/outputs/flutter-apk"
          test -f "$OUT/app-arm64-v8a-release.apk" || exit 1
          test -f "$OUT/app-armeabi-v7a-release.apk" || exit 1
          test -f "$OUT/app-x86_64-release.apk" || exit 1

      - name: Archive Release bundle
        run: |
          ARCHIVE="instant_share-android-v${{ env.VERSION }}.zip"
          cd build/app/outputs/flutter-apk
          zip "../../../../${ARCHIVE}" \
            app-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk \
            app-x86_64-release.apk
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant_share-android
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
